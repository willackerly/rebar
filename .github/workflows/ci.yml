# CI for rebar itself: the same checks contributors run locally, plus a
# govulncheck scan and a build with the oldest Go that cli/go.mod allows.
# Runs on PRs into and pushes to main and release/* branches, and on PRs
# into the go-native stack branches (each stacked PR's base is the previous
# one's branch).
name: ci

on:
  pull_request:
    branches: [main, "release/**", "feat/go-native-**"]
  push:
    branches: [main, "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A run takes ~3 min on ubuntu and ~5-8 on macOS; a hung test should not
    # hold a runner for the 6 h default. This does not bound the wait for a
    # runner: when macOS arm64 capacity runs out, GitHub cancels the queued
    # job after ~15 min ("The job was not acquired by Runner ..."), without
    # running a step. ci-retry.yml re-runs such jobs; by hand:
    #   gh run rerun <run-id> --failed
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            path_prefix: ""
            timeout: 15
          # Stock macOS /bin/bash is 3.2; put it first so `#!/usr/bin/env bash`
          # scripts run under it, as they do on a developer's Mac.
          - os: macos-latest
            path_prefix: "/bin:/usr/bin:"
            timeout: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Latest supported Go release, as release.yml builds with; go.mod's
      # `go` line is only the minimum, proven by the go-min job below.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: Tool versions
        run: |
          export PATH="${{ matrix.path_prefix }}$PATH"
          bash --version | head -1
          go version
          jq --version
          git --version

      - name: Go tests
        working-directory: cli
        # Explicit: go test's default is 10 minutes per package.
        run: go test -timeout 20m ./...

      # The release workflow's go test fails on a tag whose scripts are missing
      # from released-blobs.txt. Apply the same test to the head of a release
      # branch, via a throwaway local v* tag, so a merge that leaves the list
      # stale fails here instead of at tag time. (Not `gen-released-blobs.sh
      # --check`: the list may hold extra blobs from refs this clone lacks.)
      - name: released-blobs cover the release branch
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
        working-directory: cli
        run: |
          git tag v0.0.0-ci-head HEAD
          go test ./internal/migrate -run '^TestReleasedManifestCoversLocalTags$' -count=1

      # rebar's own checks, with the binary built from this commit (the
      # script tests, part of the suite, run the same binary).
      - name: rebar check
        run: |
          export PATH="${{ matrix.path_prefix }}$PATH"
          (cd cli && go build -o "$RUNNER_TEMP/rebar" .)
          REBAR_TEST_BIN="$RUNNER_TEMP/rebar" "$RUNNER_TEMP/rebar" check

      - name: Script tests
        run: |
          export PATH="${{ matrix.path_prefix }}$PATH"
          if [ -x scripts/tests/run.sh ]; then
            echo "scripts/tests/run.sh is part of rebar check; nothing extra to run."
            exit 0
          fi
          failed=0
          for t in scripts/tests/*.test.sh; do
            echo "::group::$t"
            bash "$t" || failed=1
            echo "::endgroup::"
          done
          exit "$failed"

  # cli/go.mod's `go` line is the oldest Go a source install (setup-rebar.sh,
  # `go build`) may use; build and test with exactly that version.
  go-min:
    name: go-min (go.mod minimum)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOTOOLCHAIN: local   # no automatic switch to a newer toolchain
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A shallow checkout, unlike the checks job: migrate recognizes
          # the legacy fixtures (released v3.1.1 blobs) from the manifest
          # compiled into the binary, so the tests need no history, and
          # this job covers that binary-only path.
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Build and test
        working-directory: cli
        run: |
          go version
          go build ./...
          go test -timeout 20m ./...

  # Known vulnerabilities (Go vulnerability database) reachable from rebar's
  # code, in its dependencies or in the standard library of the latest Go.
  # Exits non-zero on any reachable finding. vulncheck.yml rescans weekly.
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: cli/go.sum

      - name: govulncheck
        working-directory: cli
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
