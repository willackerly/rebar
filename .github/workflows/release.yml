# Release — build rebar for darwin/linux × amd64/arm64 on a v* tag push and
# publish a GitHub Release with the binaries and their SHA-256 checksums.
#
# Each asset is one self-contained binary, rebar_<ver>_<os>_<arch>
# (scripts/package-release.sh): templates, ask shims and completions are
# compiled in. setup-rebar.sh downloads and verifies it, then runs
# `rebar install-shims` beside it. (Releases up to v3.1.0 shipped whole-tree
# tarballs; the installer still handles those.)
# Tags with a pre-release suffix (v3.1.0-beta.1) become pre-releases.
#
# Third-party actions are pinned by commit SHA (the tag in the comment).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          # No shared module/build cache in the job that publishes assets.
          cache: false

      - name: Tag matches the CLI's release version
        # Unstamped builds of this tag (go build, older installers) report
        # cli/cmd.releaseVersion, so it must equal the tag being published.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          release="$(sed -n 's/^const releaseVersion = "\(.*\)"$/\1/p' cli/cmd/root.go)"
          if [ "$release" != "$TAG" ]; then
            echo "::error file=cli/cmd/root.go::releaseVersion is '$release' but the tag is '$TAG'; bump it and re-tag"
            exit 1
          fi

      - name: Test
        working-directory: cli
        # Explicit: go test's default is 10 minutes per package, and the
        # cmd package's parity suites run every bash script under test.
        run: go test -timeout 20m ./...

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh "$TAG" --out dist

      # The linux/amd64 binary runs on this runner: it must work with no
      # rebar tree at all (outside the checkout, empty HOME).
      - name: Smoke-test the binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="$PWD/dist/rebar_${TAG#v}_linux_amd64"
          work="$(mktemp -d)"
          cd "$work"
          export HOME="$work/home" && mkdir -p "$HOME"
          git config --global user.email ci@example.invalid && git config --global user.name ci
          "$bin" version | grep -qxF "rebar $TAG"
          "$bin" install-shims --dir "$work/kit" >/dev/null && test -x "$work/kit/ask"
          "$bin" new smoke >/dev/null
          (cd smoke && "$bin" check >/dev/null)

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            $prerelease
