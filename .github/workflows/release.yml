# Release — build rebar for darwin/linux × amd64/arm64 on a v* tag push and
# publish a GitHub Release with the binaries and their SHA-256 checksums.
#
# Each asset is one self-contained binary, rebar_<ver>_<os>_<arch>
# (scripts/package-release.sh): templates, ask shims and completions are
# compiled in. setup-rebar.sh downloads and verifies it, then runs
# `rebar install-shims` beside it. For v4.0.x each binary also ships as a
# small compatibility tarball, rebar_<ver>_<os>_<arch>.tar.gz, because the
# v3.1.x installers look only for tarballs (drop it in v4.1). Releases
# v3.1.0-rc.1 to v3.1.x shipped whole-tree tarballs; the installer still
# handles those.
# Tags with a pre-release suffix (v3.1.0-beta.1) become pre-releases.
#
# Two jobs: `build` (read-only token) tests, packages, smoke-tests, scans and
# attests the assets (SLSA build provenance, verifiable with
# `gh attestation verify <file> --repo willackerly/rebar`); `publish` holds the
# only write token and just creates the Release from build's artifacts, so
# no build or test code ever runs with contents: write.
#
# Built with the latest patch of the newest supported Go release (not
# cli/go.mod's minimum), so fixed standard-library vulnerabilities don't ship;
# every binary is scanned with govulncheck before anything is published, and
# the Go version is recorded in the Release notes.
#
# Third-party actions are pinned by commit SHA (the tag in the comment).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # OIDC token for the provenance attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          check-latest: true
          # No shared module/build cache in the job that builds the assets.
          cache: false

      - name: Go toolchain
        run: go version

      - name: Tag matches the CLI's release version
        # Unstamped builds of this tag (go build, older installers) report
        # cli/cmd.releaseVersion, so it must equal the tag being published.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          release="$(sed -n 's/^const releaseVersion = "\(.*\)"$/\1/p' cli/cmd/root.go)"
          if [ "$release" != "$TAG" ]; then
            echo "::error file=cli/cmd/root.go::releaseVersion is '$release' but the tag is '$TAG'; bump it and re-tag"
            exit 1
          fi

      # The Release body is the tag's CHANGELOG section, so it must exist
      # before tagging (like releaseVersion above); checked before the slow steps.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! scripts/release-notes.sh --link-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG" "$TAG" > "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::no '## $TAG' section with content; add it and re-tag"
            exit 1
          fi
          printf '\nFull changelog: [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$RUNNER_TEMP/notes.md"
          printf '\nBinaries built with %s.\n' "$(go env GOVERSION)" >> "$RUNNER_TEMP/notes.md"
          printf '\nVerify a download: `gh attestation verify <file> --repo %s` (build provenance), and its line in the checksums file.\n' \
            "$GITHUB_REPOSITORY" >> "$RUNNER_TEMP/notes.md"
          mkdir -p notes && cp "$RUNNER_TEMP/notes.md" notes/notes.md

      - name: Test
        working-directory: cli
        # Explicit: go test's default is 10 minutes per package, and the
        # cmd package's parity suites run every bash script under test.
        run: go test -timeout 20m ./...

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh "$TAG" --out dist

      # The linux/amd64 binary runs on this runner: it must work with no
      # rebar tree at all (outside the checkout, empty HOME).
      - name: Smoke-test the binary
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bin="$PWD/dist/rebar_${TAG#v}_linux_amd64"
          tarball="$bin.tar.gz"
          work="$(mktemp -d)"
          cd "$work"
          export HOME="$work/home" && mkdir -p "$HOME"
          git config --global user.email ci@example.invalid && git config --global user.name ci
          "$bin" version | grep -qxF "rebar $TAG"
          "$bin" install-shims --dir "$work/kit" >/dev/null && test -x "$work/kit/ask"
          "$bin" new smoke >/dev/null
          (cd smoke && "$bin" check >/dev/null)
          # The compatibility tarball: the same binary plus its companions.
          mkdir tar && tar -xzf "$tarball" -C tar
          kit="tar/rebar_${TAG#v}_linux_amd64/bin"
          cmp "$kit/rebar" "$bin" && test -x "$kit/ask" && test -x "$kit/rebar-install" && test ! -e "$kit/install"

      # Fail before upload if any built binary links code with a known
      # vulnerability (usually a standard-library fix newer than this Go).
      - name: govulncheck release binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          failed=0
          for bin in dist/rebar_"${TAG#v}"_*; do
            case "$bin" in *_checksums.txt|*.tar.gz) continue ;; esac
            echo "::group::govulncheck $(basename "$bin")"
            "$(go env GOPATH)/bin/govulncheck" -mode=binary "$bin" || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::govulncheck found known vulnerabilities in the release binaries; nothing was published"
            exit 1
          fi

      # Provenance for every asset (binaries, compatibility tarballs, the
      # checksums file), only once the gate above has passed.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/rebar_*

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/
          if-no-files-found: error
          retention-days: 7

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes/notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload assets
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes

      # The artifacts went through storage: publish only what the checksums
      # file (made, scanned and attested in build) still vouches for.
      - name: Check assets against the checksums
        env:
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum --strict -c "rebar_${TAG#v}_checksums.txt"
          test "$(ls | wc -l)" -eq "$(( $(wc -l < "rebar_${TAG#v}_checksums.txt") + 1 ))"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file notes/notes.md \
            --generate-notes \
            --verify-tag \
            $prerelease
