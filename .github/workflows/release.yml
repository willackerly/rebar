# Release — build rebar for darwin/linux × amd64/arm64 on a v* tag push and
# publish a GitHub Release with the tarballs and their SHA-256 checksums.
#
# Each tarball is the full tree at the tag plus bin/rebar for one platform
# (scripts/package-release.sh); setup-rebar.sh downloads and verifies it.
# Tags with a pre-release suffix (v3.1.0-beta.1) become pre-releases.
#
# Built with the latest patch of the newest supported Go release (not
# cli/go.mod's minimum), so fixed standard-library vulnerabilities don't ship;
# every binary is scanned with govulncheck before anything is published, and
# the Go version is recorded in the Release notes.
#
# Third-party actions are pinned by commit SHA (the tag in the comment).
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          # No shared module/build cache in the job that publishes assets.
          cache: false

      - name: Go toolchain
        run: go version

      - name: Tag matches the CLI's release version
        # Unstamped builds of this tag (go build, older installers) report
        # cli/cmd.releaseVersion, so it must equal the tag being published.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          release="$(sed -n 's/^const releaseVersion = "\(.*\)"$/\1/p' cli/cmd/root.go)"
          if [ "$release" != "$TAG" ]; then
            echo "::error file=cli/cmd/root.go::releaseVersion is '$release' but the tag is '$TAG'; bump it and re-tag"
            exit 1
          fi

      # The Release body is the tag's CHANGELOG section, so it must exist
      # before tagging (like releaseVersion above); checked before the slow steps.
      - name: Release notes from CHANGELOG
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! scripts/release-notes.sh --link-base "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG" "$TAG" > "$RUNNER_TEMP/notes.md"; then
            echo "::error file=CHANGELOG.md::no '## $TAG' section with content; add it and re-tag"
            exit 1
          fi
          printf '\nFull changelog: [CHANGELOG.md](%s/%s/blob/%s/CHANGELOG.md)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$TAG" >> "$RUNNER_TEMP/notes.md"
          printf '\nBinaries built with %s.\n' "$(go env GOVERSION)" >> "$RUNNER_TEMP/notes.md"

      - name: Test
        working-directory: cli
        run: go test ./...

      - name: Package
        env:
          TAG: ${{ github.ref_name }}
        run: scripts/package-release.sh "$TAG" --out dist

      # Fail before upload if any built binary links code with a known
      # vulnerability (usually a standard-library fix newer than this Go).
      - name: govulncheck release binaries
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          scan="$RUNNER_TEMP/vulncheck"
          failed=0
          for tarball in dist/*.tar.gz; do
            name="$(basename "$tarball" .tar.gz)"
            mkdir -p "$scan"
            tar -xzf "$tarball" -C "$scan" "$name/bin/rebar"
            echo "::group::govulncheck $name"
            "$(go env GOPATH)/bin/govulncheck" -mode=binary "$scan/$name/bin/rebar" || failed=1
            echo "::endgroup::"
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::govulncheck found known vulnerabilities in the release binaries; nothing was published"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes \
            --verify-tag \
            $prerelease
